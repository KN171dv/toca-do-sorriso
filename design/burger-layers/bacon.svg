<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="800" height="190">
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9351F"/><stop offset=".6" stop-color="#7A2013"/><stop offset="1" stop-color="#4E120A"/></linearGradient>
    <filter id="rough" x="-5%" y="-25%" width="110%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".022 .05" numOctaves="3" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="20"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".4" numOctaves="2" seed="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .15  0 0 0 0 .02  0 0 0 0 0  0 0 0 1.4 -.7"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <g id="strip" fill="none" stroke-linecap="butt">
      <path d="M0,40 C70,10 130,66 215,38 S350,6 440,40 S600,70 690,34" stroke="#3E0C06" stroke-width="64"/>
      <path d="M0,40 C70,10 130,66 215,38 S350,6 440,40 S600,70 690,34" stroke="url(#m)" stroke-width="56"/>
      <path d="M0,22 C70,-8 130,48 215,20 S350,-12 440,22 S600,52 690,16" stroke="#F3CDA4" stroke-width="9" opacity=".9"/>
      <path d="M0,37 C70,7 130,63 215,35 S350,3 440,37 S600,67 690,31" stroke="#C9573A" stroke-width="5" opacity=".7"/>
      <path d="M0,50 C70,20 130,76 215,48 S350,16 440,50 S600,80 690,44" stroke="#EDBE94" stroke-width="6" opacity=".8" stroke-dasharray="120 30 60 20"/>
      <path d="M0,62 C70,32 130,88 215,60 S350,28 440,62 S600,92 690,56" stroke="#2E0804" stroke-width="5" opacity=".6"/>
    </g>
  </defs>
  <g filter="url(#rough)">
    <use href="#strip" transform="translate(30,60) rotate(-3 345 40)"/>
    <use href="#strip" transform="translate(86,96) rotate(3 345 40) scale(.98,1)"/>
    <use href="#strip" transform="translate(52,24) rotate(5 345 40) scale(1.02,.9)"/>
  </g>
  <path d="M110,58 C190,36 250,84 330,58" stroke="#fff" stroke-width="6" fill="none" opacity=".3" filter="url(#soft)"/>
  <path d="M470,96 C540,116 620,124 700,98" stroke="#fff" stroke-width="6" fill="none" opacity=".22" filter="url(#soft)"/>
</svg>
